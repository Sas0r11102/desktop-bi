[package]
name = "desktop-bi"
version = "0.1.0"
description = "Desktop BI - Local data analytics dashboard"
authors = ["Haolin Li"]
edition = "2021"

[lib]
name = "desktop_bi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
calamine = "0.26"
notify = "7"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
